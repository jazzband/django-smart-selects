[tox]
envlist =
    py311-dj41
    py{311,312}-dj{42,50,main}
    flake8

[testenv]
usedevelop = True
ignore_outcome =
    djmain: True
deps =
    dj41: Django>=4.1,<4.2
    dj42: Django>=4.2,<5.0
    dj50: Django>=5.0,<5.1
    djmain: https://github.com/django/django/archive/main.tar.gz
    coverage
commands =
    coverage run --branch --source=smart_selects manage.py test
    coverage report -m
    coverage xml
    pip freeze

[testenv:flake8]
deps =
    flake8
commands =
    flake8 manage.py setup.py smart_selects test_app

[gh-actions]
python =
    3.11: py311, flake8
    3.12: py312

[gh-actions:env]
DJANGO =
    4.1: dj41
    4.2: dj42
    5.0: dj50
    main: djmain
